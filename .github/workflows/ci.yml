name: ci

# Runs the privacy gate, then the kit gate with the local gate inside it, on every push to main and
# every pull request.
# This is the design discipline made mechanical: the schema checks, the sorry-ledger
# consistency, the layer boundaries, and the standalone build all have to pass before
# a change lands. See docs/design-axioms.md (linter rules) for what is enforced.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (if any)
        run: npm ci || npm install || echo "no package manifest yet"

      - name: The privacy gate, first
        # no tracked file carries a link that is itself the access; nothing else matters if one landed
        run: node build/check-privacy.mjs

      - name: The gate
        # the kit's checks (infra.json, each disabled one with its reason) and the local gate,
        # build/check-all.mjs: the linter, every build/check-*.mjs found by name (so a new check cannot
        # be left out of a hand-kept list), every generated file regenerated and compared with the
        # committed copy, and the bundle rebuilt.
        run: node .infra/run.mjs

      - name: Verify the deliverable is a single self-contained file
        run: test -f submission.html
